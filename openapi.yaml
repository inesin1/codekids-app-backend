openapi: 3.0.3

info:
  title: CodeKids App API
  description: API для онлайн-школы программирования для детей
  version: 1.2.0

servers:
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Courses
  - name: Enrollments
  - name: Lessons
  - name: Schedule Templates
  - name: Reports
  - name: Materials
  - name: Reschedule Requests
  - name: Payouts
  - name: Analytics
  - name: Telegram
  - name: Audit

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /check:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Checks PostgreSQL. Telegram is optional and its state does not fail readiness.
      security: []
      responses:
        '200':
          description: PostgreSQL is available
          content:
            application/json:
              schema:
                type: object
                required: [status, postgres, telegram]
                properties:
                  status: { type: string, enum: [ready] }
                  postgres: { type: string, enum: [ready] }
                  telegram:
                    type: string
                    enum: [disabled, ready_optional, degraded_optional]
        '503':
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, postgres]
                properties:
                  status: { type: string, enum: [not_ready] }
                  postgres: { type: string, enum: [unavailable] }

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Tokens + user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '204':
          description: Logged out

  # ── Users ───────────────────────────────────────────────────────────────────
  /users/teachers:
    post:
      tags: [Users]
      summary: Create teacher
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    get:
      tags: [Users]
      summary: List teachers
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Поиск по имени, фамилии, логину или email-контактам (case-insensitive)
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherList'

  /users/students:
    post:
      tags: [Users]
      summary: Create student
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    get:
      tags: [Users]
      summary: List students
      description: |
        Roles: ADMIN, MANAGER (все), TEACHER (только свои — `teacherId` из query
        игнорируется, принудительно подставляется teacherProfile.id текущего пользователя).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Поиск по имени, фамилии, логину или email-контактам (case-insensitive)
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: teacherId
          in: query
          description: Только ученики этого учителя (ADMIN/MANAGER)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentList'

  /users/staff:
    post:
      tags: [Users]
      summary: Create staff (admin/manager)
      description: 'Roles: ADMIN'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users:
    get:
      tags: [Users]
      summary: List users (raw, без профилей)
      description: |
        Базовый админский список. Для доменных таблиц используй
        `/users/students`, `/users/teachers`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: roles
          in: query
          description: Comma-separated role filter; may be combined with role.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found

    patch:
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{studentId}/payments:
    post:
      tags: [Users]
      summary: Record a student balance top-up
      description: 'Roles: ADMIN, MANAGER. Adds a payment, balance transaction, and audit event atomically.'
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentDto'
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid amount
        '403':
          description: Staff access required
        '404':
          description: Student not found

  /courses:
    post:
      tags: [Courses]
      summary: Create course
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '409':
          description: Course with this name already exists
    get:
      tags: [Courses]
      summary: List courses
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Courses ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'

  /courses/{id}:
    get:
      tags: [Courses]
      summary: Get course by ID
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Not found
    patch:
      tags: [Courses]
      summary: Update course
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Not found
        '409':
          description: Course with this name already exists

  # ── Enrollments ─────────────────────────────────────────────────────────────
  /enrollments:
    post:
      tags: [Enrollments]
      summary: Create enrollment (teacher↔student binding)
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '409':
          description: Enrollment already exists for this teacher+student

    get:
      tags: [Enrollments]
      summary: List enrollments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: teacherId
          in: query
          schema:
            type: string
        - name: studentId
          in: query
          schema:
            type: string
        - name: courseId
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentList'

  /enrollments/{id}:
    get:
      tags: [Enrollments]
      summary: Get enrollment by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

    patch:
      tags: [Enrollments]
      summary: Update enrollment
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnrollmentDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  # ── Lessons ─────────────────────────────────────────────────────────────────
  /lessons/generate:
    post:
      tags: [Lessons]
      summary: Generate lessons for a date range
      description: 'Roles: ADMIN, MANAGER. When templateIds is omitted, all active templates are considered.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLessonsDto'
      responses:
        '201':
          description: Generation result
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer

  /lessons/generation-settings:
    get:
      tags: [Lessons]
      summary: Read automatic lesson generation settings
      description: 'Roles: ADMIN, MANAGER'
      responses:
        '200':
          description: Current singleton settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonGenerationSettings'
    patch:
      tags: [Lessons]
      summary: Update automatic lesson generation settings
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGenerationSettingsDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonGenerationSettings'

  /lessons:
    post:
      tags: [Lessons]
      summary: Create a one-off lesson
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'

    get:
      tags: [Lessons]
      summary: List lessons (role-scoped)
      description: |
        ADMIN/MANAGER — all lessons.
        TEACHER — own lessons.
        STUDENT — own lessons.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: dateFrom
          in: query
          required: true
          description: Inclusive business-zone calendar date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          description: Inclusive business-zone calendar date (YYYY-MM-DD), within 93 days of dateFrom.
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LessonStatus'
        - name: teacherId
          in: query
          schema:
            type: string
        - name: studentId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonList'

  /lessons/{id}:
    get:
      tags: [Lessons]
      summary: Get lesson by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'

  /lessons/{id}/complete:
    post:
      tags: [Lessons]
      summary: Mark lesson as completed
      description: |
        Roles: ADMIN, MANAGER, TEACHER.
        Teacher can only complete own lessons.
        Charges the student's balance and records a financial transaction.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          description: Lesson is not in SCHEDULED status

  /lessons/{id}/cancel:
    post:
      tags: [Lessons]
      summary: Cancel lesson
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          description: Lesson is not in SCHEDULED status

  /lessons/{id}/reschedule:
    post:
      tags: [Lessons]
      summary: Reschedule lesson to a new date
      description: 'Roles: ADMIN, MANAGER. Creates a new lesson and marks original as RESCHEDULED.'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleLessonDto'
      responses:
        '200':
          description: Rescheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'

  # ── Schedule Templates ─────────────────────────────────────────────────────
  /schedule-templates:
    post:
      tags: [Schedule Templates]
      summary: Create schedule template
      description: 'Roles: ADMIN, MANAGER'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleTemplateDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplate'

    get:
      tags: [Schedule Templates]
      summary: List schedule templates
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: teacherId
          in: query
          schema:
            type: string
        - name: studentId
          in: query
          schema:
            type: string
        - name: dayOfWeek
          in: query
          description: Return templates that contain at least one slot on this day.
          schema:
            $ref: '#/components/schemas/DayOfWeek'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScheduleTemplateList'

  /schedule-templates/{id}:
    get:
      tags: [Schedule Templates]
      summary: Get schedule template by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplate'

    patch:
      tags: [Schedule Templates]
      summary: Update schedule template
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleTemplateDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplate'

    delete:
      tags: [Schedule Templates]
      summary: Deactivate schedule template
      description: 'Roles: ADMIN, MANAGER. Sets isActive=false (soft delete).'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplate'

  # ── Reports ─────────────────────────────────────────────────────────────────
  /lessons/{lessonId}/report:
    post:
      tags: [Reports]
      summary: Create lesson report
      description: 'Roles: TEACHER (own lessons only). Bonus amount and time window use BONUS_AMOUNT and BONUS_WINDOW_HOURS (defaults 50 and 24 hours).'
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonReport'
        '409':
          description: Report already exists for this lesson

    get:
      tags: [Reports]
      summary: Get lesson report
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonReport'
        '404':
          description: Report not found

    patch:
      tags: [Reports]
      summary: Update lesson report
      description: 'Roles: TEACHER (own lessons only)'
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonReport'

  /lessons/{lessonId}/report/submit:
    post:
      tags: [Reports]
      summary: Submit report and queue it with its attachments for Telegram delivery
      description: 'Roles: TEACHER (own lessons only)'
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonReport'
        '404':
          description: Report not found

  # ── Materials ───────────────────────────────────────────────────────────────
  /lessons/{lessonId}/materials:
    get:
      tags: [Materials]
      summary: List lesson materials
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'

  /lessons/{lessonId}/materials/{id}:
    delete:
      tags: [Materials]
      summary: Delete material
      description: 'Roles: ADMIN, MANAGER, TEACHER'
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /lessons/{lessonId}/materials/upload:
    post:
      tags: [Materials]
      summary: Upload a file to lesson materials
      description: 'Roles: ADMIN, MANAGER, TEACHER (own lessons). Maximum file size: 10 MB.'
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                reportId:
                  type: string
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'

  /lessons/{lessonId}/materials/{id}/file:
    get:
      tags: [Materials]
      summary: Download an uploaded lesson material
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ── Reschedule Requests ─────────────────────────────────────────────────────
  /lessons/{lessonId}/reschedule-requests:
    post:
      tags: [Reschedule Requests]
      summary: Create reschedule/cancel request
      description: 'Roles: TEACHER, STUDENT'
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRescheduleRequestDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleRequest'

  /reschedule-requests:
    get:
      tags: [Reschedule Requests]
      summary: List reschedule requests
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RescheduleRequestStatus'
        - name: lessonId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRescheduleRequestList'

  /reschedule-requests/{id}/approve:
    post:
      tags: [Reschedule Requests]
      summary: Approve reschedule request
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleRequest'

  /reschedule-requests/{id}/reject:
    post:
      tags: [Reschedule Requests]
      summary: Reject reschedule request
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleRequest'

  # ── Payouts ─────────────────────────────────────────────────────────────────
  /payouts/calculate:
    post:
      tags: [Payouts]
      summary: Calculate payout for a teacher
      description: 'Roles: ADMIN, MANAGER. Aggregates completed lessons + report bonuses.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatePayoutDto'
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          description: periodStart must be before periodEnd
        '409':
          description: Payout already exists for overlapping period

  /payouts/calculate-all:
    post:
      tags: [Payouts]
      summary: Calculate payouts for all teachers
      description: 'Roles: ADMIN, MANAGER. Skips teachers with existing payouts for the period.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateAllPayoutsDto'
      responses:
        '201':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      type: string
                    description: IDs of created payouts
                  skipped:
                    type: array
                    items:
                      type: string
                    description: Teacher IDs skipped (overlap)

  /payouts:
    get:
      tags: [Payouts]
      summary: List payouts (role-scoped)
      description: |
        ADMIN/MANAGER — all payouts.
        TEACHER — own payouts only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: teacherId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PayoutStatus'
        - name: periodStart
          in: query
          schema:
            type: string
            format: date-time
        - name: periodEnd
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayoutList'

  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit events
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: userId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit events ordered newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'

  /payouts/{id}/pay:
    patch:
      tags: [Payouts]
      summary: Mark payout as paid
      description: 'Roles: ADMIN'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Marked as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          description: Payout is not in PENDING status

  # ── Analytics ───────────────────────────────────────────────────────────────
  /analytics/lessons/jobs:
    post:
      tags: [Analytics]
      summary: Start lesson analytics report generation
      description: 'Roles: ADMIN, MANAGER. Report rows, summary, and XLSX are retained for one hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonsAnalyticsFilters'
      responses:
        '201':
          description: Report job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsJobCreated'
        '400':
          description: Invalid report filters

  /analytics/payouts/jobs:
    post:
      tags: [Analytics]
      summary: Start payout analytics report generation
      description: 'Roles: ADMIN, MANAGER. Report rows, summary, and XLSX are retained for one hour.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutsAnalyticsFilters'
      responses:
        '201':
          description: Report job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsJobCreated'
        '400':
          description: Invalid report filters

  /analytics/jobs/{jobId}:
    get:
      tags: [Analytics]
      summary: Get analytics report job status
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job state, progress, and completed summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsJobStatus'
        '404':
          description: Job is missing or its one-hour retention expired

  /analytics/jobs/{jobId}/rows:
    get:
      tags: [Analytics]
      summary: Read a sorted page from a completed report snapshot
      description: 'Roles: ADMIN, MANAGER. Sorting uses the stored report snapshot and is stable by row ID.'
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sortBy
          in: query
          schema: { type: string }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Sorted page from the report snapshot
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaginatedLessonAnalyticsRows'
                  - $ref: '#/components/schemas/PaginatedPayoutAnalyticsRows'
        '404':
          description: Job is missing or its one-hour retention expired
        '409':
          description: Report is not ready

  /analytics/jobs/{jobId}/export:
    get:
      tags: [Analytics]
      summary: Download the XLSX file from a completed report job
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: XLSX file containing the full report snapshot and totals
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Job is missing or its one-hour retention expired
        '409':
          description: Report is not ready

  # ── Telegram ────────────────────────────────────────────────────────────────
  /telegram/groups/{studentId}/link:
    post:
      tags: [Telegram]
      summary: Create one-time link to bind a Telegram group to a student
      description: 'Roles: ADMIN, MANAGER. Link t.me/<bot>?startgroup=<token>, single-use, valid 24h'
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLink'
        '404':
          description: Student not found
        '503':
          description: Telegram is not configured

  /telegram/groups/{studentId}:
    delete:
      tags: [Telegram]
      summary: Unbind student's Telegram group
      description: 'Roles: ADMIN, MANAGER'
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Unbound

  /telegram/users/{userId}/link:
    post:
      tags: [Telegram]
      summary: Create one-time link to connect user's private Telegram chat
      description: 'Self, or ADMIN/MANAGER for any user. Link t.me/<bot>?start=<token>, single-use, valid 24h'
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLink'
        '403':
          description: Not self and not staff
        '404':
          description: User not found
        '503':
          description: Telegram is not configured
    delete:
      tags: [Telegram]
      summary: Disconnect user's private Telegram chat
      description: 'Self, or ADMIN/MANAGER for any user'
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Disconnected
        '403':
          description: Not self and not staff

  /telegram/webhook:
    post:
      tags: [Telegram]
      summary: Telegram Bot API webhook
      description: Public. Requires X-Telegram-Bot-Api-Secret-Token equal to TELEGRAM_WEBHOOK_SECRET. Persists update_id before acknowledging; background inbox processing is retryable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Telegram Update object
      responses:
        '201':
          description: Update durably accepted, including duplicate update_id
        '400':
          description: Invalid update_id
        '401':
          description: Invalid secret token
        '500':
          description: Persistence failed; Telegram should retry

  /telegram/queue-health:
    get:
      tags: [Telegram]
      summary: Aggregated durable queue health
      description: ADMIN/MANAGER only. No message payloads or recipient details.
      responses:
        '200':
          description: Queue counts and oldest pending timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { type: integer }
                  failed: { type: integer }
                  leased: { type: integer }
                  expiredLease: { type: integer }
                  oldestPendingAt:
                    { type: string, format: date-time, nullable: true }
                  pendingInbox: { type: integer }
                  failedInbox: { type: integer }
                  leasedInbox: { type: integer }
        '403':
          description: Staff access required

# ── Components ────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string

  schemas:
    PaginationEnvelope:
      type: object
      required: [meta, links]
      properties:
        meta:
          type: object
          required: [itemsPerPage, totalItems, currentPage, totalPages, sortBy]
          properties:
            itemsPerPage: { type: integer }
            totalItems: { type: integer }
            currentPage: { type: integer }
            totalPages: { type: integer }
            sortBy:
              type: array
              description: Ordered pairs of field name and direction; empty when no explicit sorting is requested.
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: string }
        links:
          type: object
          required: [current, next, last]
          properties:
            current: { type: string }
            next:
              { type: string, description: Empty when there is no next page. }
            last: { type: string }

    PaginatedUserList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/User' }
    PaginatedStudentList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/StudentListItem' }
    PaginatedTeacherList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TeacherListItem' }
    PaginatedEnrollmentList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Enrollment' }
    PaginatedLessonList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Lesson' }
    PaginatedScheduleTemplateList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ScheduleTemplate' }
    PaginatedRescheduleRequestList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/RescheduleRequest' }
    PaginatedPayoutList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Payout' }
    PaginatedAuditLogList:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }

    # ── Enums ─────────────────────────────────────────────────────────────────
    Role:
      type: string
      enum: [ADMIN, MANAGER, TEACHER, STUDENT]

    LessonStatus:
      type: string
      enum: [SCHEDULED, COMPLETED, CANCELED, RESCHEDULED]

    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    PayoutStatus:
      type: string
      enum: [PENDING, PAID]

    AnalyticsReportType:
      type: string
      enum: [lessons, payouts]

    AnalyticsJobState:
      type: string
      enum: [waiting, active, completed, failed]

    AnalyticsJobCreated:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }

    AnalyticsJobStatus:
      type: object
      required: [jobId, reportType, status, progress]
      properties:
        jobId: { type: string }
        reportType: { $ref: '#/components/schemas/AnalyticsReportType' }
        status: { $ref: '#/components/schemas/AnalyticsJobState' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        summary:
          oneOf:
            - $ref: '#/components/schemas/LessonsAnalyticsSummary'
            - $ref: '#/components/schemas/PayoutsAnalyticsSummary'
        totalItems: { type: integer, minimum: 0 }
        error: { type: string }

    LessonsAnalyticsFilters:
      type: object
      required: [dateFrom, dateTo]
      properties:
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        teacherId: { type: string }
        studentId: { type: string }

    PayoutsAnalyticsFilters:
      type: object
      required: [dateFrom, dateTo]
      properties:
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        teacherId: { type: string }
        status: { $ref: '#/components/schemas/PayoutStatus' }

    LessonsAnalyticsSummary:
      type: object
      required: [completedLessonCount, lessonRevenue, teacherAccrued, topUps]
      properties:
        completedLessonCount: { type: integer, minimum: 0 }
        lessonRevenue: { type: string, description: Exact Decimal string }
        teacherAccrued: { type: string, description: Exact Decimal string }
        topUps: { type: string, nullable: true, description: Exact Decimal string }

    PayoutsAnalyticsSummary:
      type: object
      required: [payoutCount, totalPayout, paidPayout, pendingPayout]
      properties:
        payoutCount: { type: integer, minimum: 0 }
        totalPayout: { type: string, description: Exact Decimal string }
        paidPayout: { type: string, description: Exact Decimal string }
        pendingPayout: { type: string, description: Exact Decimal string }

    LessonAnalyticsRow:
      type: object
      required: [id, scheduledAt, completedAt, durationMinutes, price, teacherRate, bonusAmount, teacherId, teacherName, studentId, studentName, courseName]
      properties:
        id: { type: string }
        scheduledAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        price: { type: string, description: Exact Decimal string }
        teacherRate: { type: string, nullable: true, description: Exact Decimal string }
        bonusAmount: { type: string, description: Exact Decimal string }
        teacherId: { type: string }
        teacherName: { type: string }
        studentId: { type: string }
        studentName: { type: string }
        courseName: { type: string }

    PayoutAnalyticsRow:
      type: object
      required: [id, teacherId, teacherName, periodStart, periodEnd, basePay, bonusPay, totalPay, status, paidAt]
      properties:
        id: { type: string }
        teacherId: { type: string }
        teacherName: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        basePay: { type: string, description: Exact Decimal string }
        bonusPay: { type: string, description: Exact Decimal string }
        totalPay: { type: string, description: Exact Decimal string }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        paidAt: { type: string, format: date-time, nullable: true }

    PaginatedLessonAnalyticsRows:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/LessonAnalyticsRow' }

    PaginatedPayoutAnalyticsRows:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/PayoutAnalyticsRow' }

    TransactionType:
      type: string
      enum: [LESSON_CHARGE, MANUAL_TOPUP, ADJUSTMENT]

    RescheduleRequestType:
      type: string
      enum: [RESCHEDULE, CANCEL]

    RescheduleRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    Course:
      type: object
      required: [id, name, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCourseDto:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    UpdateCourseDto:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        isActive: { type: boolean }

    LessonGenerationSettings:
      type: object
      required: [id, enabled, triggerDay, daysAhead, updatedAt]
      properties:
        id: { type: string, example: singleton }
        enabled: { type: boolean }
        triggerDay: { $ref: '#/components/schemas/DayOfWeek' }
        daysAhead: { type: integer, minimum: 1, maximum: 365 }
        updatedAt: { type: string, format: date-time }

    UpdateGenerationSettingsDto:
      type: object
      properties:
        enabled: { type: boolean }
        triggerDay: { $ref: '#/components/schemas/DayOfWeek' }
        daysAhead: { type: integer, minimum: 1, maximum: 365 }

    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        details: { type: object, nullable: true, additionalProperties: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true

    # ── Auth DTOs ─────────────────────────────────────────────────────────────
    LoginDto:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    # ── User DTOs ─────────────────────────────────────────────────────────────
    CreateUserDto:
      type: object
      required: [login, password, firstName, lastName]
      properties:
        login:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        contacts:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ContactDto'
        avatarUrl:
          type: string

    CreateStudentDto:
      type: object
      required: [firstName, lastName]
      description: login and password are optional, but must be supplied together.
      properties:
        login:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        contacts:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ContactDto'
        avatarUrl:
          type: string
        parentName:
          type: string
          maxLength: 201
        birthDate:
          type: string
          format: date-time

    CreateStaffDto:
      allOf:
        - $ref: '#/components/schemas/CreateUserDto'
        - type: object
          required: [roles]
          properties:
            roles:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                type: string
                enum: [ADMIN, MANAGER, TEACHER]

    UpdateUserDto:
      type: object
      properties:
        login:
          type: string
          nullable: true
          maxLength: 254
          description: Supply together with password; null together clears portal access.
        password:
          type: string
          nullable: true
          minLength: 8
          maxLength: 128
        birthDate:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        avatarUrl:
          type: string
        roles:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [ADMIN, MANAGER, TEACHER]
          description: An empty array clears staff roles; TEACHER is additive.
        parentName:
          type: string
          maxLength: 201

    User:
      type: object
      description: |
        Password and securityVersion are never included in ordinary user responses.
        Profile relations are included only when an endpoint explicitly loads them.
      properties:
        id:
          type: string
        login:
          type: string
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date-time
          nullable: true
        contacts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContactDto'
        avatarUrl:
          type: string
          nullable: true
        telegramChatId:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        teacherProfile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TeacherProfile'
        studentProfile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StudentProfile'

    TeacherProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudentProfile:
      type: object
      properties:
        userId:
          type: string
        parentName:
          type: string
          nullable: true
        balance:
          type: string
          description: Decimal(12,2) student balance; may be negative. Omitted from teacher student lists.
        age:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── List items (для табличных представлений) ─────────────────────────────
    StudentListItem:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            studentProfile:
              type: object
              description: |
                StudentProfile including parent contacts for student tables.
              allOf:
                - $ref: '#/components/schemas/StudentProfile'

    TeacherListItem:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            teacherProfile:
              $ref: '#/components/schemas/TeacherProfile'

    ContactDto:
      type: object
      required: [label, value]
      properties:
        id:
          type: string
        label:
          type: string
          maxLength: 50
        value:
          type: string
          maxLength: 500

    # ── Enrollment DTOs ───────────────────────────────────────────────────────
    CreateEnrollmentDto:
      type: object
      required: [teacherId, studentId, lessonPrice, teacherRate]
      properties:
        teacherId:
          type: string
        studentId:
          type: string
        lessonPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        teacherRate:
          type: number
          minimum: 0
          exclusiveMinimum: true

    UpdateEnrollmentDto:
      type: object
      properties:
        lessonPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        teacherRate:
          type: number
          minimum: 0
          exclusiveMinimum: true
        isActive:
          type: boolean

    Enrollment:
      type: object
      properties:
        id:
          type: string
        teacherId:
          type: string
        studentId:
          type: string
        lessonPrice:
          type: string
          description: Decimal
        teacherRate:
          type: string
          description: Decimal
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        teacher:
          $ref: '#/components/schemas/ProfileWithUser'
        student:
          $ref: '#/components/schemas/ProfileWithUser'

    # ── Lesson DTOs ───────────────────────────────────────────────────────────
    CreateLessonDto:
      type: object
      required: [enrollmentId, scheduledAt]
      description: Teacher and student IDs are derived from Enrollment; supplied IDs must match it.
      properties:
        enrollmentId:
          type: string
        teacherId:
          type: string
        studentId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
        price:
          type: number
          minimum: 0
        teacherRate:
          type: number
          minimum: 0

    GenerateLessonsDto:
      type: object
      required: [dateFrom, dateTo]
      properties:
        dateFrom:
          type: string
          format: date-time
        dateTo:
          type: string
          format: date-time
        templateIds:
          type: array
          minItems: 1
          items:
            type: string

    RescheduleLessonDto:
      type: object
      required: [newDate]
      properties:
        newDate:
          type: string
          format: date-time

    Lesson:
      type: object
      properties:
        id:
          type: string
        templateId:
          type: string
          nullable: true
        enrollmentId:
          type: string
        teacherId:
          type: string
        studentId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/LessonStatus'
        price:
          type: string
          nullable: true
          description: Decimal
        teacherRate:
          type: string
          nullable: true
          description: Decimal
        completedAt:
          type: string
          format: date-time
          nullable: true
        rescheduledToId:
          type: string
          nullable: true
        teacher:
          $ref: '#/components/schemas/ProfileWithUser'
        student:
          $ref: '#/components/schemas/ProfileWithUser'
        report:
          $ref: '#/components/schemas/LessonReport'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Schedule Template DTOs ────────────────────────────────────────────────
    ScheduleTemplateSlotInput:
      type: object
      required: [dayOfWeek, startTime]
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '16:00'
        durationMinutes:
          type: integer
          minimum: 15
          default: 60

    CreateScheduleTemplateDto:
      type: object
      required: [enrollmentId, slots]
      description: Teacher and student IDs are derived from Enrollment; supplied IDs must match it.
      properties:
        enrollmentId:
          type: string
        teacherId:
          type: string
        studentId:
          type: string
        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScheduleTemplateSlotInput'
        timezone:
          type: string
          description: IANA timezone the slot start times are defined in.
          default: Europe/Moscow
          example: Asia/Almaty

    UpdateScheduleTemplateDto:
      type: object
      properties:
        isActive:
          type: boolean
        timezone:
          type: string
          description: IANA timezone the slot start times are defined in.
          example: Asia/Almaty
        slots:
          type: array
          description: Replaces all slots of the template when provided.
          minItems: 1
          items:
            $ref: '#/components/schemas/ScheduleTemplateSlotInput'

    ScheduleTemplateSlot:
      type: object
      properties:
        id:
          type: string
        templateId:
          type: string
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        startTime:
          type: string
          example: '16:00'
        durationMinutes:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScheduleTemplate:
      type: object
      properties:
        id:
          type: string
        enrollmentId:
          type: string
        teacherId:
          type: string
        studentId:
          type: string
        isActive:
          type: boolean
        timezone:
          type: string
          description: IANA timezone the slot start times are defined in.
          example: Asia/Almaty
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTemplateSlot'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Report DTOs ───────────────────────────────────────────────────────────
    CreateReportDto:
      type: object
      required: [topic, covered, results]
      properties:
        topic:
          type: string
        covered:
          type: string
        results:
          type: string
        parentComment:
          type: string
        homework:
          type: string
        recommendations:
          type: string
        extraNotes:
          type: string

    UpdateReportDto:
      type: object
      properties:
        topic:
          type: string
        covered:
          type: string
        results:
          type: string
        parentComment:
          type: string
        homework:
          type: string
        recommendations:
          type: string
        extraNotes:
          type: string

    LessonReport:
      type: object
      properties:
        id:
          type: string
        lessonId:
          type: string
        topic:
          type: string
        covered:
          type: string
        results:
          type: string
        parentComment:
          type: string
          nullable: true
        homework:
          type: string
          nullable: true
        recommendations:
          type: string
          nullable: true
        extraNotes:
          type: string
          nullable: true
        bonusApplied:
          type: boolean
        bonusAmount:
          type: string
          nullable: true
          description: Decimal
        sentToTelegram:
          type: boolean
        status:
          type: string
          enum: [DRAFT, SUBMITTED]
        submittedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Material DTOs ─────────────────────────────────────────────────────────
    Material:
      type: object
      properties:
        id:
          type: string
        lessonId:
          type: string
          nullable: true
        title:
          type: string
        fileType:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        uploadedAt:
          type: string
          format: date-time

    # ── Reschedule Request DTOs ───────────────────────────────────────────────
    CreateRescheduleRequestDto:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RescheduleRequestType'
        reason:
          type: string
        proposedDate:
          type: string
          format: date-time
          description: Required when type=RESCHEDULE

    RescheduleRequest:
      type: object
      properties:
        id:
          type: string
        lessonId:
          type: string
        type:
          $ref: '#/components/schemas/RescheduleRequestType'
        reason:
          type: string
          nullable: true
        createdById:
          type: string
        proposedDate:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        resolvedById:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        sentToTelegram:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Payout DTOs ───────────────────────────────────────────────────────────
    CalculatePayoutDto:
      type: object
      required: [teacherId, periodStart, periodEnd]
      properties:
        teacherId:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time

    CalculateAllPayoutsDto:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time

    Payout:
      type: object
      properties:
        id:
          type: string
        teacherId:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        basePay:
          type: string
          description: Decimal
        bonusPay:
          type: string
          description: Decimal
        totalPay:
          type: string
          description: Decimal
        status:
          $ref: '#/components/schemas/PayoutStatus'
        paidAt:
          type: string
          format: date-time
          nullable: true
        teacher:
          $ref: '#/components/schemas/ProfileWithUser'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payment:
      type: object
      required: [id, studentId, amount, paidAt, createdAt]
      properties:
        id: { type: string }
        studentId: { type: string }
        amount: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,2})?$' }
        description: { type: string, nullable: true }
        paidAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CreatePaymentDto:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          pattern: '^(?:0|[1-9][0-9]{0,9})(?:\\.[0-9]{1,2})?$'
          description: Positive amount, with at most two decimal places.
        description: { type: string, maxLength: 500 }

    # ── Shared ────────────────────────────────────────────────────────────────
    ProfileWithUser:
      type: object
      description: Teacher/Student profile with nested user
      properties:
        id:
          type: string
        userId:
          type: string
        user:
          $ref: '#/components/schemas/User'

    TelegramLink:
      type: object
      properties:
        url:
          type: string
          example: https://t.me/codekids_bot?startgroup=3q2-7wEAAAAAAAAAAAAAAA

security:
  - BearerAuth: []
